name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            cmake: -DTFIRE_SDL_STATIC=OFF
            artifact: tfire
          - os: ubuntu-latest
            target: linux-arm64
            cmake: -DTFIRE_SDL_STATIC=OFF
            runs-on: ubuntu-latest
            container: docker://arm64v8/ubuntu:22.04
            artifact: tfire
          - os: macos-latest
            target: macos-arm64
            cmake: -DTFIRE_SDL_STATIC=OFF -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact: tfire
          - os: macos-latest
            target: macos-x64
            cmake: -DTFIRE_SDL_STATIC=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64
            artifact: tfire
          - os: windows-latest
            target: windows-x64
            cmake: -DTFIRE_SDL_STATIC=OFF -A x64
            artifact: tfire.exe
          - os: windows-latest
            target: windows-arm64
            cmake: -DTFIRE_SDL_STATIC=OFF -A ARM64
            artifact: tfire.exe
    runs-on: ${{ matrix.os || matrix.runs-on || 'ubuntu-latest' }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build libsdl2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sdl2
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja sdl2 --no-progress
      - name: Configure
        run: rm -rf build && cmake -B build -G Ninja ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build -j
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/tfire${{ matrix.target == 'windows-x64' || matrix.target == 'windows-arm64' && '.exe' || '' }}
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-x64/tfire
            linux-arm64/tfire
            macos-arm64/tfire
            macos-x64/tfire
            windows-x64/tfire.exe
            windows-arm64/tfire.exe
          generate_release_notes: true
